<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ST BARTH SOCIETY</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}
/* VIDÉO EN ARRIÈRE-PLAN */
.video-background {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
}
/* VOILE SOMBRE PAR-DESSUS LA VIDÉO */
.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.28);
    z-index: 1;
}
/* CONTENU PRINCIPAL */
.hero {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    /* FALLBACK VISUEL SI VIDÉO INACTIVE */
    background: url("video-poster.jpg") center center / cover no-repeat;
}
/* ST BARTH SOCIETY */
.logo {
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    font-size: clamp(38px, 7vw, 100px);
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-shadow:
        0 2px 10px rgba(0,0,0,0.8),
        0 0 30px rgba(255,255,255,0.15);
}
/* MOBILE */
@media (max-width: 600px) {
    .logo {
        font-size: 12vw;
        letter-spacing: 0.05em;
    }
}
/* ACCESSIBILITÉ : RÉDUCTION DES MOUVEMENTS */
@media (prefers-reduced-motion: reduce) {
    .video-background {
        display: none;
    }
    .overlay {
        display: none;
    }
    /* On garde uniquement le fond statique */
    .hero {
        background: url("video-poster.jpg") center center / cover no-repeat;
    }
}
</style>
</head>
<body>
<!-- VIDÉO EN ARRIÈRE-PLAN -->
<video
    class="video-background"
    autoplay
    muted
    loop
    playsinline
    preload="auto"
    poster="video-poster.jpg"
    aria-hidden="true"
    role="presentation"
>
    <!-- WEBM (PRIORITÉ PERFORMANCE) -->
    <source
        src="3184eb260ffd4e3ab528f4e8ae29f7f8.webm"
        type="video/webm"
    >
    <!-- FALLBACK QUICKTIME -->
    <source
        src="3184eb260ffd4e3ab528f4e8ae29f7f8.mov"
        type="video/quicktime"
    >
</video>
<!-- ASSOMBRISSEMENT -->
<div class="overlay"></div>
<!-- LOGO -->
<main class="hero">
    <h1 class="logo">ST BARTH SOCIETY</h1>
</main>
</body>
</html>
