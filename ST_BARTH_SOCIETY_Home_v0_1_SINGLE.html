<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ST BARTH SOCIETY</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}
/* VIDÉO EN ARRIÈRE-PLAN */
.video-background {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
    pointer-events: none;
}
/* VOILE SOMBRE PAR-DESSUS LA VIDÉO */
.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.28);
    z-index: 1;
}
/* CONTENU PRINCIPAL */
.hero {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    /* FALLBACK VISUEL SI VIDÉO INACTIVE */
    background: url("video-poster.jpg") center center / cover no-repeat;
}
/* ST BARTH SOCIETY */
.logo {
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    font-size: clamp(38px, 7vw, 100px);
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-shadow:
        0 2px 10px rgba(0,0,0,0.8),
        0 0 30px rgba(255,255,255,0.15);
}
/* MOBILE */
@media (max-width: 600px) {
    .logo {
        font-size: 12vw;
        letter-spacing: 0.05em;
    }
}
/* ACCESSIBILITÉ : RÉDUCTION DES MOUVEMENTS */
@media (prefers-reduced-motion: reduce) {
    .video-background {
        display: none;
    }
    .overlay {
        display: none;
    }
    /* On garde uniquement le fond statique */
    .hero {
        background: url("video-poster.jpg") center center / cover no-repeat;
    }
}
</style>
</head>
<body>
<!-- VIDÉO EN ARRIÈRE-PLAN (désactivée par défaut pour préserver l'UX) -->
<video
    id="bgvideo"
    class="video-background"
    muted
    loop
    playsinline
    webkit-playsinline
    preload="none"
    poster="video-poster.jpg"
    aria-hidden="true"
    role="presentation"
>
    <!-- Placeholders pour sources optimisées (ajoute mp4/webm compatibles ici lorsqu'ils sont disponibles) -->
    <!-- <source src="3184eb260ffd4e3ab528f4e8ae29f7f8.mp4" type="video/mp4"> -->
    <!-- <source src="3184eb260ffd4e3ab528f4e8ae29f7f8.webm" type="video/webm"> -->

    <!-- Fallback : fichier .mov actuellement présent à la racine -->
    <source src="3184eb260ffd4e3ab528f4e8ae29f7f8.mov" type="video/quicktime">
</video>
<!-- ASSOMBRISSEMENT -->
<div class="overlay"></div>
<!-- LOGO -->
<main class="hero">
    <h1 class="logo">ST BARTH SOCIETY</h1>
</main>

<!-- Script : active la lecture uniquement sur desktop avec bonne connexion ou après interaction utilisateur -->
<script>
(function(){
  var v = document.getElementById('bgvideo');
  if(!v) return;
  // s'assurer que la vidéo est non-interactive
  v.style.pointerEvents = 'none';

  function isGoodConnection(){
    try{
      var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      if(conn && conn.effectiveType){
        var et = conn.effectiveType || '';
        if(et.indexOf('2g') !== -1 || et.indexOf('slow-2g') !== -1) return false;
      }
    }catch(e){}
    return true;
  }

  var isDesktop = window.innerWidth >= 768;
  var tryAuto = isDesktop && isGoodConnection();

  function activateVideo(){
    if(!v) return;
    v.setAttribute('preload','auto');
    var p = v.play();
    if(p !== undefined){
      p.catch(function(){ /* playback failed; keep poster/overlay */ });
    }
    window.removeEventListener('click', onUserInteract);
    window.removeEventListener('touchstart', onUserInteract);
  }

  function onUserInteract(){ activateVideo(); }

  if(tryAuto){
    // tenter une lecture automatique discrète
    setTimeout(function(){
      var p = v.play();
      if(p !== undefined){
        p.catch(function(){ /* autoplay blocked or decode error */ });
      }
    }, 200);
  }

  // Activation fallback : lancer après première interaction utilisateur
  window.addEventListener('click', onUserInteract, { once: true });
  window.addEventListener('touchstart', onUserInteract, { once: true });
})();
</script>
</body>
</html>
